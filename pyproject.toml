[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ingesta"
version = "0.1.0"
description = "Ingesta y extracción de CFDI (frente 4)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pymupdf>=1.24,<2",
    "defusedxml>=0.7.1,<0.8",
    "zxing-cpp>=2.2,<4",
    "pillow>=10,<13",
    "boto3>=1.34,<2",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4.21,<5"]

[tool.setuptools.packages.find]
include = ["ingesta*"]

[tool.setuptools.package-data]
ingesta = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
